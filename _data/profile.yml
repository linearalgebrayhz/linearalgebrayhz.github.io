short_bio_text_justify: false
short_bio: >-
  <p>
    I am a final-year undergraduate studying Computer Science and Mathematics at the University of Hong Kong.
  </p>
  <p>
    I am seeking PhD opportunities for Fall 2027.
  </p>
  <p>
    My research lies at the intersection of <strong>multimodal generative modeling</strong>, <strong>spatial intelligence</strong>, and <strong>embodied AI</strong>. I am particularly interested in how intelligent systems can build grounded representations of dynamic 3D environments and generate coherent behaviors from multimodal signals such as language, vision, speech, and motion.
  </p>
  <p>
    My recent work explores these questions through controllable camera motion generation from text and keyframes, as well as emotion-aware generation of human motion and speech. These projects have led me to broader questions about how generative models can understand, predict, and interact with dynamic physical environments.
  </p>

